<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles.css">

  <title>Frontend Mentor | Browser extensions manager UI</title>

  <script src="./script.js" defer></script>
</head>
<body>

  <header class="app-header">
    <div class="app-header__brand">
      <img class="app-header__logo" src="./assets/images/logo.svg" alt="" width="40" height="40">
      <span class="app-header__title">Extensions</span>
    </div>

    <button class="theme-toggle" type="button" id="theme-toggle">
      <img class="theme-toggle__icon theme-toggle__icon--moon" src="./assets/images/icon-moon.svg" alt="" width="18" height="18">
      <img class="theme-toggle__icon theme-toggle__icon--sun" src="./assets/images/icon-sun.svg" alt="" width="18" height="18">
      <span class="visually-hidden">Switch to dark theme</span>
    </button>
  </header>

  <main class="app-main">
    <div class="list-header">
      <h1 class="list-header__title">Extensions List</h1>

      <div class="filters" role="group" aria-label="Filter extensions by state">
        <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
        <button class="filter" type="button" data-filter="inactive" aria-pressed="false">Inactive</button>
      </div>
    </div>

    <p class="empty-state" id="empty-state" hidden>No extensions to show.</p>

    <ul class="extension-grid" id="extension-grid"></ul>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener noreferrer">Frontend Mentor</a>.
    Built by <a href="#">Your Name Here</a>.
  </footer>

  <template id="card-template">
    <li class="card">
      <div class="card__body">
        <img class="card__logo" src="" alt="">
        <h2 class="card__name"></h2>
        <p class="card__description"></p>
      </div>
      <div class="card__footer">
        <button class="btn btn--remove" type="button">Remove<span class="visually-hidden"></span></button>
        <button class="switch" type="button" role="switch" aria-checked="true">
          <span class="visually-hidden"></span>
        </button>
      </div>
    </li>
  </template>

</body>
</html>
